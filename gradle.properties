org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2G

# Hytale server artifact to compile against.
# hytale_channel is "release" or "pre-release" and selects the Maven repository.
# Override on the command line, for example
#   ./gradlew build -Phytale_channel=release -Phytale_version=0.7.0
hytale_channel=release
hytale_version=0.7.1
